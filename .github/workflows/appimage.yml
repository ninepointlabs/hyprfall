name: AppImage

# Build the AppImage (Quickshell and Qt bundled) on Ubuntu 22.04 and check it
# with packaging/appimage/test.sh.
#
# - release.yml calls this for every tag; the AppImage, .zsync and .sha256
#   then go out with the other packages in the same release.
# - Run it by hand with a tag (Actions > AppImage > Run workflow) to add an
#   AppImage to a release made before this workflow existed: it builds that
#   tag's game with this branch's packaging and uploads only the
#   hyprfall-*-x86_64.AppImage* files to the release. Nothing else in the
#   release changes.
# - Pull requests that touch the game or its packaging build and check it,
#   without uploading anything.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the AppImage for and attach it to (e.g. v0.1.2)
        required: true
  pull_request:
    paths:
      - app/**
      - bin/**
      - assets/icons/**
      - packaging/**
      - .github/workflows/appimage.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version and game files
        id: what
        env:
          TAG: ${{ inputs.tag }}
        run: |
          game="$GITHUB_WORKSPACE"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
            git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG"; exit 1; }
            version="${TAG#v}"
            game="$RUNNER_TEMP/game"
            git worktree add --detach "$game" "$TAG"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "game=$game" >>"$GITHUB_OUTPUT"
          echo "AppImage for Hyprfall $version, game files from $game"
      - name: Install build tools
        run: sudo packaging/appimage/deps.sh
      # Qt and the Quickshell build take most of the time and only change
      # with these scripts.
      - uses: actions/cache@v4
        with:
          path: |
            build/appimage/qt
            build/appimage/quickshell
          key: appimage-qt-quickshell-${{ hashFiles('packaging/appimage/deps.sh', 'packaging/appimage/build-quickshell.sh', 'packaging/appimage/build.sh') }}
      - name: Build
        run: packaging/appimage/build.sh "${{ steps.what.outputs.version }}" "${{ steps.what.outputs.game }}"
      - name: Check
        run: packaging/appimage/test.sh "dist/hyprfall-${{ steps.what.outputs.version }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/hyprfall-*-x86_64.AppImage*
          if-no-files-found: error

  # Only for a hand-run backfill; release.yml publishes the AppImage itself.
  upload:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "Assets before:"; gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release upload "$TAG" hyprfall-*-x86_64.AppImage hyprfall-*-x86_64.AppImage.zsync hyprfall-*-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Assets after:"; gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
